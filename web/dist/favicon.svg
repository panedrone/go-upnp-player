<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- go-upnp-player: a network streamer box with a green play badge -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ea7b3"/>
      <stop offset="0.45" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#b9c1cc"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b7480"/>
      <stop offset="1" stop-color="#8d96a2"/>
    </linearGradient>
    <radialGradient id="badge" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#6ee787"/>
      <stop offset="0.55" stop-color="#22a447"/>
      <stop offset="1" stop-color="#14742f"/>
    </radialGradient>
  </defs>
  <!-- box -->
  <path d="M10 14 L34 10 L40 13 L40 56 L16 60 L10 57 Z" fill="url(#side)"/>
  <path d="M16 17 L40 13 L40 56 L16 60 Z" fill="url(#body)"/>
  <path d="M10 14 L34 10 L40 13 L16 17 Z" fill="#dfe4ea"/>
  <!-- slots and the status light -->
  <path d="M20 24 L36 21.5 M20 29 L36 26.5 M20 34 L36 31.5" stroke="#8b939e" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="22" cy="52" r="1.6" fill="#3ddc6a"/>
  <!-- play badge -->
  <circle cx="45" cy="19" r="15" fill="#0b3d1a" opacity="0.35"/>
  <circle cx="44" cy="18" r="14" fill="url(#badge)" stroke="#0e5a25" stroke-width="1.2"/>
  <path d="M39.5 10.5 L52.5 18 L39.5 25.5 Z" fill="#ffffff"/>
</svg>
